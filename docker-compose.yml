# IQOS Monitor – one container: web UI + API + SQLite.
# Save as docker-compose.yml, then:  docker compose up -d
# Optional overrides (environment or .env): IQOS_PORT, TZ, DISPLAY_TZ, AGENT_API_KEY, IQOS_TAG.

services:
  iqos-monitor:
    image: ghcr.io/nikopol666/iqos-monitor:${IQOS_TAG:-latest}
    container_name: iqos-monitor
    restart: unless-stopped
    ports:
      - "${IQOS_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Prague}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Prague}
      DATABASE_PATH: /data/iqos.sqlite3
      # Optional fixed key accepted from every agent (otherwise create keys in Settings → Agents).
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    volumes:
      - iqos-data:/data

volumes:
  iqos-data:
