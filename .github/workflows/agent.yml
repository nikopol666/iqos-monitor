name: agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python run_tests.py
      - name: Stamp the version from the git tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || v="$(git describe --tags --always 2>/dev/null | sed 's/^v//')-ci"
          echo "__version__ = \"$v\"" > iqos_agent/_version.py
          cat iqos_agent/_version.py
      - name: Build IQOS-Agent.exe
        run: pyinstaller --noconfirm iqos_agent.spec
      - uses: actions/upload-artifact@v4
        with:
          name: IQOS-Agent-windows
          path: agent/dist/IQOS-Agent.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/IQOS-Agent.exe
